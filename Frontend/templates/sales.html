<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales</title>

    <link rel="stylesheet" href="../static/style.css">

</head>

<body>

    <!-- =======================
         Navigation Bar
    ======================== -->

    <header>

        <nav class="navbar">

            <div class="logo">
                <h2>Inventory System</h2>
            </div>

            <ul class="nav-links">

                <li><a href="index.html">Home</a></li>

                <li><a href="dashboard.html">Dashboard</a></li>

                <li><a href="products.html">Products</a></li>

                <li><a href="suppliers.html">Suppliers</a></li>

                <li><a href="inventory.html">Inventory</a></li>

                <li><a href="sales.html">Sales</a></li>

                <li><a href="reports.html">Reports</a></li>

            </ul>

        </nav>

    </header>


     <!-- =======================
         Back Button
    ======================== -->

    <div class="top-buttons">

        <button onclick="history.back()">

             Back

        </button>

    </div>

    <h1>Sales Management</h1>

    <form id="saleForm">

        <input
            type="number"
            id="product_id"
            placeholder="Product ID"
            required
        >

        <input
            type="number"
            id="quantity"
            placeholder="Quantity"
            required
        >

        <input
            type="number"
            step="0.01"
            id="selling_price"
            placeholder="Selling Price"
            required
        >

        <input
            type="date"
            id="sale_date"
            required
        >

        <button type="submit">
            Add Sale
        </button>

    </form>

    <br>

    <table border="1">

        <thead>

            <tr>

                <th>Sale ID</th>
                <th>Product ID</th>
                <th>Quantity</th>
                <th>Selling Price</th>
                <th>Sale Date</th>

            </tr>

        </thead>

        <tbody id="salesTable">

        </tbody>

    </table>

<script>

const API = "http://127.0.0.1:8000/sales";

const token = localStorage.getItem("access_token");

loadSales();

function loadSales(){

    fetch(API,{

        headers:{
            "Authorization":"Bearer " + token
        }

    })

    .then(response => response.json())

    .then(data=>{

        let rows="";

        data.forEach(sale=>{

            rows +=`

            <tr>

                <td>${sale.sale_id}</td>

                <td>${sale.product_id}</td>

                <td>${sale.quantity}</td>

                <td>${sale.selling_price}</td>

                <td>${sale.sale_date}</td>

            </tr>

            `;

        });

        document.getElementById("salesTable").innerHTML=rows;

    });

}

document.getElementById("saleForm").onsubmit=function(e){

    e.preventDefault();

    let sale={

        product_id:Number(document.getElementById("product_id").value),

        quantity:Number(document.getElementById("quantity").value),

        selling_price:Number(document.getElementById("selling_price").value),

        sale_date:document.getElementById("sale_date").value

    };

    fetch(API,{

        method:"POST",

        headers:{

            "Content-Type":"application/json",

            "Authorization":"Bearer " + token

        },

        body:JSON.stringify(sale)

    })

    .then(response=>response.json())

    .then(()=>{

        document.getElementById("saleForm").reset();

        loadSales();

    });

};

</script>

</body>

</html>
