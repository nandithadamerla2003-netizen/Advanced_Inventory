
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet"
          href="../static/style.css">

</head>

<body>

<!-- Navigation -->

<header>

    <nav class="navbar">

        <div class="logo">

            <h1>Inventory System</h1>

        </div>

        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>

            <li><a href="login.html">Login</a></li>

            <li><a href="register.html">Register</a></li>

        </ul>

    </nav>

</header>


<!-- Back Button -->

<div class="top-buttons">

    <button onclick="history.back()">

         Back

    </button>

</div>

<div class="title">

    <h2>Advanced Inventory & Supplier Management System</h2>

</div>

<!-- Register Container -->

<section class="register-page">

    <div class="register-title">

        <h3>

            Create Your Account

        </h3>

        <p>

            Register to access the
            Advanced Inventory & Supplier Management System.

        </p>

    </div>


    <div class="register-card">

        <form id="registerForm">

            <div class="input-group">

                <label>

                    Full Name

                </label>

                <input
                    type="text"
                    id="full_name"
                    placeholder="Enter Full Name"
                    required
                >

            </div>

            <div class="input-group">

                <label>

                    Username

                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter Username"
                    required
                >

            </div>

            <div class="input-group">

                <label>

                    Email

                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email Address"
                    required
                >

            </div>

            <div class="input-group">

                <label>

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >

            </div>

            <div class="input-group">

                <label>

                    Confirm Password

                </label>

                <input
                    type="password"
                    id="confirm_password"
                    placeholder="Confirm Password"
                    required
                >

            </div>

            <button type="submit">

                Register Account

            </button>

        </form>

        <div class="register-footer">

            Already have an account?

            <a href="login.html">

                Login

            </a>

        </div>

    </div>

</section>

<script src="../static/script.js"></script>

</body>

</html>
